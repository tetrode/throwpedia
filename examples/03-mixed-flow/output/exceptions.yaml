ExceptionReason:DIRECT_NEW_INVALIDARGUMENTEXCEPTION:
	attributeName: ExceptionReason
	values:
		code: DIRECT_NEW_INVALIDARGUMENTEXCEPTION
		technicalReason: Thrown from App\Service\PaymentService::pay
		businessReason: Direct instantiation of InvalidArgumentException

	exception: InvalidArgumentException
	thrown_from:
		- App\Service\PaymentService::pay

ExceptionReason:INVALID_AMOUNT:
	attributeName: ExceptionReason
	values:
		code: INVALID_AMOUNT
		technicalReason: 'Amount is <= 0'
		businessReason: Please enter a valid amount.

	exception: 'InvalidArgumentException, App\Exception\PaymentException::processingError'
	thrown_from:
		- App\Service\PaymentService::pay

ExceptionReason:PAYMENT_FAILED:
	attributeName: ExceptionReason
	values:
		code: PAYMENT_FAILED
		technicalReason: Gateway timeout
		businessReason: We could not process your payment at this time.

	exception: 'InvalidArgumentException, App\Exception\PaymentException::processingError'
	thrown_from:
		- App\Service\PaymentService::pay

